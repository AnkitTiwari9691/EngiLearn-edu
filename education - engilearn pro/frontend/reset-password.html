<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - EngiLearn</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css?v=scrollfix1">
    <link rel="stylesheet" href="css/style.css?v=50">
    
    <link rel="stylesheet" href="./assets/css/theme-engine.css?v=43">
  <link rel="stylesheet" href="assets/css/seo-enhancements.css?v=1">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1W4DBNS2P3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-1W4DBNS2P3');

<body class="auth-page auth-v2-page auth-login-nothing auth-reset-page" data-theme="light">
    <main class="auth-v2-shell">
        <section class="auth-v2-panel">
            <a class="auth-brand auth-v2-brand" href="index.html"><i class="fas fa-graduation-cap"></i> EngiLearn</a>
            <div class="auth-v2-copy">
                <span class="auth-kicker">Final Verification</span>
                <h1>Create a new password after OTP.</h1>
                <p>Verify the OTP from your EngiLearn account, then save your new password.</p>
            </div>
            <div class="auth-v2-steps">
                <span><i class="fas fa-key"></i> OTP</span>
                <span><i class="fas fa-lock"></i> New password</span>
                <span><i class="fas fa-rotate"></i> Revoke tokens</span>
                <span><i class="fas fa-circle-check"></i> Login</span>
            </div>
        </section>

        <section class="auth-v2-card">
            <div class="auth-card-head">
                <span class="auth-card-icon"><i class="fas fa-shield-halved"></i></span>
                <div>
                    <h2>Reset Password</h2>
                    <p>Verify OTP, then save your new password.</p>
                </div>
            </div>
            <div id="authAlert"></div>
            <form class="auth-form" id="verifyResetForm">
                <label>Role
                    <select id="role" name="role">
                        <option value="">Automatic role detection</option>
                        <option value="Student">Student</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Admin">Admin</option>
                    </select>
                </label>
                <label>Email or Mobile
                    <input id="identifier" required placeholder="email@example.com or mobile number">
                </label>
                <div class="otp-grid">
                    <input data-otp maxlength="1" inputmode="numeric">
                    <input data-otp maxlength="1" inputmode="numeric">
                    <input data-otp maxlength="1" inputmode="numeric">
                    <input data-otp maxlength="1" inputmode="numeric">
                    <input data-otp maxlength="1" inputmode="numeric">
                    <input data-otp maxlength="1" inputmode="numeric">
                </div>
                <button class="auth-submit" type="submit"><i class="fas fa-shield"></i> Verify OTP</button>
            </form>
            <form class="auth-form auth-complete-form" id="resetForm" hidden>
                <label>New Password
                    <input id="newPassword" type="password" required placeholder="New strong password">
                </label>
                <label>Confirm Password
                    <input id="confirmPassword" type="password" required placeholder="Confirm password">
                </label>
                <button class="auth-submit" type="submit"><i class="fas fa-save"></i> Save Password</button>
            </form>
            <div class="auth-v2-actions">
                <a href="forgot-password.html"><i class="fas fa-paper-plane"></i> Send OTP again</a>
                <a href="login.html"><i class="fas fa-arrow-right-to-bracket"></i> Login</a>
            </div>
        </section>
    </main>
    <script src="assets/js/api.js?v=53"></script>
    <script src="js/toast.js?v=1"></script>
    <script src="js/auth.js?v=53"></script>
    <script src="js/resetPassword.js?v=55"></script>
    <script src="./assets/js/theme-engine.js?v=7"></script>
  <script src="assets/js/seo-enhancements.js?v=1" defer></script>
</body>
</html>
